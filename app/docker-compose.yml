services:
  app-backend:
    image: ${APP_IMAGE:-app:latest}
    container_name: app-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_URL: ${APP_URL:-http://app-dev.th-deg.de}
      KEYCLOAK_URL: http://keycloak:8080/keycloak
      KEYCLOAK_REALM: spatialhub
      AUTH_SERVICE_URL: http://auth-service:8001
      WEBSERVICE_SERVICE_URL: http://webservice:8082
      CO2ROUTEX_HOST: ${CO2ROUTEX_HOST:-co2routex}
      CO2ROUTEX_PORT: ${CO2ROUTEX_PORT:-8000}
      CO2ROUTEX_URL: ${CO2ROUTEX_URL:-}
      STORECO2_HOST: ${STORECO2_HOST:-storeco2}
      STORECO2_PORT: ${STORECO2_PORT:-8000}
      STORECO2_URL: ${STORECO2_URL:-}
      RATE_LIMIT_PER_MIN: 1000
    volumes:
      - backend-storage:/app/storage
    networks:
      - spatialhub-net

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/ssl:/etc/letsencrypt:ro
      - ../nginx/certbot:/var/www/certbot:ro
    depends_on:
      - app-backend
    networks:
      - spatialhub-net

volumes:
  backend-storage:

networks:
  spatialhub-net:
    external: true
