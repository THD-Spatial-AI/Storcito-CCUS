name: Production pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      step:
        description: Which job to run manually
        required: true
        default: check-runner
        type: choice
        options:
          - check-runner
          - infra-postgres-redis
          - infra-keycloak
          - infra-keycloak-init
          - platform-auth-webservice
          - deploy-app
          - migrate
          - seed

env:
  SERVER_URL_PROD: https://ccus.th-deg.de
  DEPLOY_SUBDIR_PROD: deploy
  APP_DEPLOY_COMPOSE: docker-compose.deploy.yml
  APP_IMAGE: ccus-app:latest

jobs:
  check-runner:
    if: ${{ github.event_name == 'push' || github.event.inputs.step == 'check-runner' }}
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check runner
        run: |
          echo '=== Checking runner ==='
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS: ${RUNNER_OS} (${RUNNER_ARCH})"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA::8}"
          echo "Deploy path: $HOME/${DEPLOY_SUBDIR_PROD}"
          docker --version
          docker compose version
          echo '=== Runner OK ==='

  infra-postgres-redis:
    if: ${{ github.event.inputs.step == 'infra-postgres-redis' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Postgres and Redis
        run: |
          set -e
          echo '=== [PROD] Setting up Postgres and Redis ==='
          DEPLOY_PATH_PROD="$HOME/${DEPLOY_SUBDIR_PROD}"
          mkdir -p \
            "$DEPLOY_PATH_PROD/platform-core/auth-service" \
            "$DEPLOY_PATH_PROD/platform-core/webservice" \
            "$DEPLOY_PATH_PROD/infrastructure/common" \
            "$DEPLOY_PATH_PROD/infrastructure/platform" \
            "$DEPLOY_PATH_PROD/app/backend" \
            "$DEPLOY_PATH_PROD/nginx"
          cp -r infrastructure/common/. "$DEPLOY_PATH_PROD/infrastructure/common/"
          cp -r infrastructure/platform/. "$DEPLOY_PATH_PROD/infrastructure/platform/"
          cp platform-core/docker-compose.yml "$DEPLOY_PATH_PROD/platform-core/"
          cp -r platform-core/auth-service/. "$DEPLOY_PATH_PROD/platform-core/auth-service/"
          cp -r platform-core/webservice/. "$DEPLOY_PATH_PROD/platform-core/webservice/"
          cp "$DEPLOY_PATH_PROD/platform-core/auth-service/.env.example" "$DEPLOY_PATH_PROD/platform-core/auth-service/.env" 2>/dev/null || true
          cp "$DEPLOY_PATH_PROD/platform-core/webservice/.env.example" "$DEPLOY_PATH_PROD/platform-core/webservice/.env" 2>/dev/null || true
          cp app/backend/.env.example "$DEPLOY_PATH_PROD/app/backend/.env.example"
          [ -f "$DEPLOY_PATH_PROD/app/backend/.env" ] || cp "$DEPLOY_PATH_PROD/app/backend/.env.example" "$DEPLOY_PATH_PROD/app/backend/.env"
          cd "$DEPLOY_PATH_PROD/platform-core"
          AUTH_ENV="$DEPLOY_PATH_PROD/platform-core/auth-service/.env"
          WEB_ENV="$DEPLOY_PATH_PROD/platform-core/webservice/.env"
          sed -i 's|^APP_ENV=.*|APP_ENV=production|' "$AUTH_ENV"
          sed -i 's|^COOKIE_DOMAIN=.*|COOKIE_DOMAIN=ccus.th-deg.de|' "$AUTH_ENV"
          sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=${SERVER_URL_PROD}|" "$AUTH_ENV"
          sed -i "s|^WEB_URLS=.*|WEB_URLS=${SERVER_URL_PROD}|" "$AUTH_ENV"
          sed -i "s|^KEYCLOAK_URL=.*|KEYCLOAK_URL=http://keycloak:8080/keycloak|" "$AUTH_ENV"
          sed -i "s|^REDIRECT_URL=.*|REDIRECT_URL=${SERVER_URL_PROD}/api/callback-auth|" "$AUTH_ENV"
          sed -i 's|^BACKEND_SERVICE_URL=.*|BACKEND_SERVICE_URL=http://app-backend-prod:8000|' "$AUTH_ENV"
          sed -i 's|^DB_HOST=.*|DB_HOST=postgres|' "$AUTH_ENV"
          sed -i 's|^DB_PORT=.*|DB_PORT=5432|' "$AUTH_ENV"
          sed -i 's|^REDIS_HOST=.*|REDIS_HOST=redis|' "$AUTH_ENV"
          sed -i 's|^REDIS_PORT=.*|REDIS_PORT=6379|' "$AUTH_ENV"
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=|' "$AUTH_ENV"
          sed -i 's|^APP_ENV=.*|APP_ENV=production|' "$WEB_ENV"
          sed -i "s|^CALLBACK_URL=.*|CALLBACK_URL=${SERVER_URL_PROD}|" "$WEB_ENV"
          sed -i 's|^DB_HOST=.*|DB_HOST=postgres|' "$WEB_ENV"
          sed -i 's|^DB_PORT=.*|DB_PORT=5432|' "$WEB_ENV"
          sed -i 's|^REDIS_HOST=.*|REDIS_HOST=redis|' "$WEB_ENV"
          sed -i 's|^REDIS_PORT=.*|REDIS_PORT=6379|' "$WEB_ENV"
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=|' "$WEB_ENV"
          chmod 600 "$AUTH_ENV" "$WEB_ENV"
          touch .env
          sed -i '/^KEYCLOAK_ISSUER_URL=/d' .env
          echo "KEYCLOAK_ISSUER_URL=${SERVER_URL_PROD}/keycloak" >> .env
          grep -q '^KC_HOSTNAME=' .env && \
            sed -i "s|^KC_HOSTNAME=.*|KC_HOSTNAME=${SERVER_URL_PROD}/keycloak|" .env || \
            echo "KC_HOSTNAME=${SERVER_URL_PROD}/keycloak" >> .env
          sed -i '/^KC_HOSTNAME_BACKCHANNEL_DYNAMIC=/d' .env
          echo 'KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true' >> .env
          chmod 600 .env
          docker network create spatialhub-net 2>/dev/null || true
          docker compose up -d postgres redis
          echo 'Waiting for Postgres to be ready...'
          sleep 10
          docker compose ps postgres redis
          echo '=== [PROD] Postgres and Redis started ==='

  infra-keycloak:
    if: ${{ github.event.inputs.step == 'infra-keycloak' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Start Keycloak
        run: |
          set -e
          echo '=== [PROD] Starting Keycloak ==='
          DEPLOY_PATH_PROD="$HOME/${DEPLOY_SUBDIR_PROD}"
          mkdir -p "$DEPLOY_PATH_PROD/platform-core/auth-service/keycloak"
          cp platform-core/docker-compose.yml "$DEPLOY_PATH_PROD/platform-core/"
          cp -r platform-core/auth-service/keycloak/. "$DEPLOY_PATH_PROD/platform-core/auth-service/keycloak/"
          cd "$DEPLOY_PATH_PROD/platform-core"
          touch .env
          sed -i '/^KEYCLOAK_ISSUER_URL=/d' .env
          echo "KEYCLOAK_ISSUER_URL=${SERVER_URL_PROD}/keycloak" >> .env
          grep -q '^KC_HOSTNAME=' .env && \
            sed -i "s|^KC_HOSTNAME=.*|KC_HOSTNAME=${SERVER_URL_PROD}/keycloak|" .env || \
            echo "KC_HOSTNAME=${SERVER_URL_PROD}/keycloak" >> .env
          sed -i '/^KC_HOSTNAME_BACKCHANNEL_DYNAMIC=/d' .env
          echo 'KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true' >> .env
          chmod 600 .env
          docker compose up -d --force-recreate keycloak
          echo 'Waiting for Keycloak to be healthy...'
          sleep 30
          docker compose ps keycloak
          echo '=== [PROD] Keycloak started ==='

  infra-keycloak-init:
    if: ${{ github.event.inputs.step == 'infra-keycloak-init' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run Keycloak init
        run: |
          set -e
          echo '=== [PROD] Running Keycloak Init ==='
          DEPLOY_PATH_PROD="$HOME/${DEPLOY_SUBDIR_PROD}"
          cd "$DEPLOY_PATH_PROD/platform-core"
          SERVER_URL="${SERVER_URL_PROD}" docker compose up keycloak-init
          echo '=== Checking KEYCLOAK_CLIENT_SECRET ==='
          grep KEYCLOAK_CLIENT_SECRET "$DEPLOY_PATH_PROD/app/backend/.env" || echo 'Not found in app'
          grep KEYCLOAK_CLIENT_SECRET "$DEPLOY_PATH_PROD/platform-core/auth-service/.env" || echo 'Not found in auth-service'
          grep KEYCLOAK_CLIENT_SECRET "$DEPLOY_PATH_PROD/platform-core/webservice/.env" || echo 'Not found in webservice'
          echo '=== [PROD] Keycloak Init complete ==='

  platform-auth-webservice:
    if: ${{ github.event.inputs.step == 'platform-auth-webservice' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Start auth-service and webservice
        run: |
          set -e
          echo '=== [PROD] Starting Auth Service and Webservice ==='
          DEPLOY_PATH_PROD="$HOME/${DEPLOY_SUBDIR_PROD}"
          mkdir -p \
            "$DEPLOY_PATH_PROD/platform-core/auth-service" \
            "$DEPLOY_PATH_PROD/platform-core/webservice" \
            "$DEPLOY_PATH_PROD/infrastructure/common" \
            "$DEPLOY_PATH_PROD/infrastructure/platform"
          cp -r infrastructure/common/. "$DEPLOY_PATH_PROD/infrastructure/common/"
          cp -r infrastructure/platform/. "$DEPLOY_PATH_PROD/infrastructure/platform/"
          cp platform-core/docker-compose.yml "$DEPLOY_PATH_PROD/platform-core/"
          cp -r platform-core/auth-service/. "$DEPLOY_PATH_PROD/platform-core/auth-service/"
          cp -r platform-core/webservice/. "$DEPLOY_PATH_PROD/platform-core/webservice/"
          [ -f "$DEPLOY_PATH_PROD/platform-core/auth-service/.env" ] || cp "$DEPLOY_PATH_PROD/platform-core/auth-service/.env.example" "$DEPLOY_PATH_PROD/platform-core/auth-service/.env"
          [ -f "$DEPLOY_PATH_PROD/platform-core/webservice/.env" ] || cp "$DEPLOY_PATH_PROD/platform-core/webservice/.env.example" "$DEPLOY_PATH_PROD/platform-core/webservice/.env"
          cd "$DEPLOY_PATH_PROD/platform-core"
          AUTH_ENV="$DEPLOY_PATH_PROD/platform-core/auth-service/.env"
          WEB_ENV="$DEPLOY_PATH_PROD/platform-core/webservice/.env"
          sed -i 's|^APP_ENV=.*|APP_ENV=production|' "$AUTH_ENV"
          sed -i 's|^COOKIE_DOMAIN=.*|COOKIE_DOMAIN=ccus.th-deg.de|' "$AUTH_ENV"
          sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=${SERVER_URL_PROD}|" "$AUTH_ENV"
          sed -i "s|^WEB_URLS=.*|WEB_URLS=${SERVER_URL_PROD}|" "$AUTH_ENV"
          sed -i "s|^KEYCLOAK_URL=.*|KEYCLOAK_URL=http://keycloak:8080/keycloak|" "$AUTH_ENV"
          sed -i "s|^REDIRECT_URL=.*|REDIRECT_URL=${SERVER_URL_PROD}/api/callback-auth|" "$AUTH_ENV"
          sed -i 's|^BACKEND_SERVICE_URL=.*|BACKEND_SERVICE_URL=http://app-backend-prod:8000|' "$AUTH_ENV"
          sed -i 's|^DB_HOST=.*|DB_HOST=postgres|' "$AUTH_ENV"
          sed -i 's|^DB_PORT=.*|DB_PORT=5432|' "$AUTH_ENV"
          sed -i 's|^REDIS_HOST=.*|REDIS_HOST=redis|' "$AUTH_ENV"
          sed -i 's|^REDIS_PORT=.*|REDIS_PORT=6379|' "$AUTH_ENV"
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=|' "$AUTH_ENV"
          sed -i 's|^APP_ENV=.*|APP_ENV=production|' "$WEB_ENV"
          sed -i "s|^CALLBACK_URL=.*|CALLBACK_URL=${SERVER_URL_PROD}|" "$WEB_ENV"
          sed -i 's|^DB_HOST=.*|DB_HOST=postgres|' "$WEB_ENV"
          sed -i 's|^DB_PORT=.*|DB_PORT=5432|' "$WEB_ENV"
          sed -i 's|^REDIS_HOST=.*|REDIS_HOST=redis|' "$WEB_ENV"
          sed -i 's|^REDIS_PORT=.*|REDIS_PORT=6379|' "$WEB_ENV"
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=|' "$WEB_ENV"
          chmod 600 "$AUTH_ENV" "$WEB_ENV"
          touch .env
          sed -i '/^KEYCLOAK_ISSUER_URL=/d' .env
          echo "KEYCLOAK_ISSUER_URL=${SERVER_URL_PROD}/keycloak" >> .env
          grep -q '^KC_HOSTNAME=' .env && \
            sed -i "s|^KC_HOSTNAME=.*|KC_HOSTNAME=${SERVER_URL_PROD}/keycloak|" .env || \
            echo "KC_HOSTNAME=${SERVER_URL_PROD}/keycloak" >> .env
          sed -i '/^KC_HOSTNAME_BACKCHANNEL_DYNAMIC=/d' .env
          echo 'KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true' >> .env
          sed -i '/^BACKEND_INTERNAL_URL=/d' .env
          echo 'BACKEND_INTERNAL_URL=http://app-backend-prod:8000' >> .env
          chmod 600 .env
          docker compose build --no-cache auth-service webservice
          docker compose up -d --no-deps --force-recreate auth-service webservice
          sleep 5
          docker compose ps auth-service webservice
          docker image prune -f
          echo '=== [PROD] Auth Service and Webservice started ==='

  deploy-app:
    if: ${{ github.event.inputs.step == 'deploy-app' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: |
          set -e
          echo '=== [PROD] Building CCUS App image ==='
          docker build --no-cache --provenance=false --sbom=false \
            --build-arg VITE_CARTO_BASEMAP_API_KEY="${{ secrets.VITE_CARTO_BASEMAP_API_KEY }}" \
            -t "${APP_IMAGE}" -f app/backend/Dockerfile .
          docker image prune -f
          echo '=== [PROD] Build complete ==='
      - name: Deploy CCUS App
        run: |
          set -e
          echo '=== [PROD] Deploying CCUS App ==='
          DEPLOY_PATH_PROD="$HOME/${DEPLOY_SUBDIR_PROD}"
          mkdir -p "$DEPLOY_PATH_PROD/app/backend" "$DEPLOY_PATH_PROD/nginx/conf.d" "$DEPLOY_PATH_PROD/nginx/ssl" "$DEPLOY_PATH_PROD/nginx/certbot"
          cp "app/${APP_DEPLOY_COMPOSE}" "$DEPLOY_PATH_PROD/app/"
          cp nginx/nginx.conf "$DEPLOY_PATH_PROD/nginx/"
          cp nginx/conf.d/ccus.th-deg.de.conf "$DEPLOY_PATH_PROD/nginx/conf.d/"
          cp app/backend/.env.example "$DEPLOY_PATH_PROD/app/backend/.env.example"
          [ -f "$DEPLOY_PATH_PROD/app/backend/.env.prod" ] || cp "$DEPLOY_PATH_PROD/app/backend/.env.example" "$DEPLOY_PATH_PROD/app/backend/.env.prod"
          ENV_PROD="$DEPLOY_PATH_PROD/app/backend/.env.prod"
          sed -i 's|^APP_ENV=.*|APP_ENV=production|' "$ENV_PROD"
          sed -i "s|^APP_URL=.*|APP_URL=${SERVER_URL_PROD}|" "$ENV_PROD"
          sed -i "s|^REDIRECT_URL=.*|REDIRECT_URL=${SERVER_URL_PROD}/callback-auth|" "$ENV_PROD"
          sed -i 's|^COOKIE_DOMAIN=.*|COOKIE_DOMAIN=ccus.th-deg.de|' "$ENV_PROD"
          if grep -q '^KEYCLOAK_CLIENT_SECRET=' "$DEPLOY_PATH_PROD/app/backend/.env" 2>/dev/null; then
            KC_SECRET=$(grep '^KEYCLOAK_CLIENT_SECRET=' "$DEPLOY_PATH_PROD/app/backend/.env" | head -1)
            sed -i '/^KEYCLOAK_CLIENT_SECRET=/d' "$ENV_PROD"
            echo "$KC_SECRET" >> "$ENV_PROD"
          else
            echo 'WARNING: KEYCLOAK_CLIENT_SECRET not found in .env; run infra-keycloak-init first'
          fi
          # Compute VM services.
          for kv in \
            "STORECO2_HOST=${{ vars.STORECO2_HOST }}" "STORECO2_PORT=${{ vars.STORECO2_PORT || '8020' }}" \
            "ADOPTNET0_HOST=${{ vars.ADOPTNET0_HOST }}" "ADOPTNET0_PORT=${{ vars.ADOPTNET0_PORT || '8030' }}"; do
            key="${kv%%=*}"
            sed -i "/^${key}=/d" "$ENV_PROD"
            echo "$kv" >> "$ENV_PROD"
          done
          sed -i '/^STORECO2_URL=/d' "$ENV_PROD"
          chmod 600 "$ENV_PROD"
          docker network create spatialhub-net 2>/dev/null || true
          for c in app-backend; do
            if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
              docker stop "$c" 2>/dev/null || true
              docker rm "$c" 2>/dev/null || true
            fi
          done
          cd "$DEPLOY_PATH_PROD/app"
          docker volume create backend-storage-prod >/dev/null
          APP_IMAGE="${APP_IMAGE}" docker compose -f "$APP_DEPLOY_COMPOSE" up -d --force-recreate app-backend-prod nginx
          sleep 5
          docker compose -f "$APP_DEPLOY_COMPOSE" ps
          # Drop old images.
          docker image prune -f
          echo '=== [PROD] CCUS App deployed ==='

  migrate:
    if: ${{ github.event.inputs.step == 'migrate' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations
        run: |
          set -e
          echo '=== [PROD] Running Migrations ==='
          DEPLOY_PATH_PROD="$HOME/${DEPLOY_SUBDIR_PROD}"
          cd "$DEPLOY_PATH_PROD/app"
          APP_IMAGE="${APP_IMAGE}" docker compose -f "$APP_DEPLOY_COMPOSE" run --rm --entrypoint /app/migrate app-backend-prod
          echo '=== [PROD] Migrations complete ==='

  seed:
    if: ${{ github.event.inputs.step == 'seed' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run seed
        run: |
          set -e
          echo '=== [PROD] Running Seed ==='
          DEPLOY_PATH_PROD="$HOME/${DEPLOY_SUBDIR_PROD}"
          cd "$DEPLOY_PATH_PROD/app"
          APP_IMAGE="${APP_IMAGE}" docker compose -f "$APP_DEPLOY_COMPOSE" run --rm -e SEED_KEYCLOAK_USER=false --entrypoint /app/seed app-backend-prod
          echo '=== [PROD] Seed complete ==='
